[workspace]

[package]
name = "stateless-validator-reth-zkvm"
version = "0.1.0"
edition = "2024"

# One guest object for every zkVM: a `staticlib` of LLVM bitcode, linked against a zkVM SDK
# (`libzkvm.a` + `zkvm.ld`) by ere's toolchain. It names no zkVM.
[lib]
crate-type = ["staticlib"]

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
    "native-keccak",
] }

# Draft: ere-platform-zkvm from the ere branch that adds it, until ere releases it.
ere-platform-zkvm = { git = "https://github.com/frisitano/ere", branch = "feat/zkvm-accelerators-linker" }

# `sp1` is the zkvm-standards crypto provider plus `native_keccak256` on `zkvm_keccak256`, which
# is what every zkVM needs here.
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", default-features = false, features = [
    "sp1",
] }

# 256-bit EVM arithmetic (MUL, DIV, MOD, ADDMOD, MULMOD, EXP) through the zkVM SDK's `zkvm_u256_*`,
# on the stack's little-endian limbs: revm-interpreter's `zkvm-u256` feature, from the vendored copy
# patched in below.
revm-interpreter = { version = "43.0.2", default-features = false, features = ["zkvm-u256"] }

[patch.crates-io]
revm-interpreter = { path = "../../../vendor/revm-interpreter" }

# ere-platform-zkvm implements the workspace's ere-platform-core, unchanged since v0.17.0.
[patch."https://github.com/eth-act/ere"]
ere-platform-core = { git = "https://github.com/frisitano/ere", branch = "feat/zkvm-accelerators-linker" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
