[workspace]

[package]
name = "stateless-validator-reth-zkvm"
version = "0.1.0"
edition = "2024"

# One guest object for every zkVM: a `staticlib` of LLVM bitcode, linked against a zkVM SDK
# (`libzkvm.a` + `zkvm.ld`) by ere's toolchain. It names no zkVM.
[lib]
crate-type = ["staticlib"]

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
    "native-keccak",
] }

# Draft: a path into an ere checkout next to this one, until ere publishes `ere-platform-zkvm`.
ere-platform-zkvm = { path = "../../../../ere/crates/platform/zkvm" }

# `sp1` is the zkvm-standards crypto provider plus `native_keccak256` on `zkvm_keccak256`, which
# is what every zkVM needs here.
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", default-features = false, features = [
    "sp1",
] }

# ere-platform-zkvm implements the workspace's ere-platform-core, unchanged since v0.17.0.
[patch."https://github.com/eth-act/ere"]
ere-platform-core = { path = "../../../../ere/crates/platform/core" }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
